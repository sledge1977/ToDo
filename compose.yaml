services:
  todo:
    build: .
    ports:
      - "${TODO_PORT:-8080}:8080"
    volumes:
      # Keep authentication cookies valid when the application container is recreated.
      - data-protection-keys:/root/.aspnet/DataProtection-Keys
    environment:
      ConnectionStrings__Postgres: Host=postgres;Port=5432;Database=todo;Username=todo;Password=${POSTGRES_PASSWORD:-todo-development-only}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: todo
      POSTGRES_USER: todo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-todo-development-only}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U todo -d todo"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  postgres-data:
  data-protection-keys:
